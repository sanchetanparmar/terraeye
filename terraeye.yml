# This is TerraEye CONFIG — not a GitHub Actions workflow.
# Do NOT put this file in .github/workflows/
# yaml-language-server: $schema=https://raw.githubusercontent.com/sanchetanparmar/terraeye/main/schemas/terraeye.schema.json

fail_on:
  - critical
  - high

paths:
  - "**/*.tf"
  - "**/*.tfvars"
  - "**/terraform/**"

ignore_paths:
  - "**/.terraform/**"
  - "**/vendor/**"

inline_comments:
  enabled: true
  min_severity: high

ai:
  enabled: true
  provider: openai
  model: gpt-4o-mini

cost:
  enabled: true
  currency: USD

scanners:
  builtin: true
  checkov: false
  tflint: false
  trivy: false

comment:
  marker: "<!-- terraeye-review -->"
  collapse_details: true

check:
  name: Terraform AI Review
