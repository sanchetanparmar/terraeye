name: Self-test TerraEye

# Dogfood: when this repo's own Terraform fixtures change, run the local action.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "tests/fixtures/**"
      - "action.yml"
      - "dist/index.js"
      - "src/**"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  terraeye:
    name: Terraform AI Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm run build:action
      - name: Run TerraEye (local action)
        uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: terraeye.yml
          plan-file: tests/fixtures/plan.json
          fail-on: none
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
