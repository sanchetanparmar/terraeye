name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure action bundle is up to date
        run: |
          git diff --exit-code -- dist/index.js || (
            echo "::error::dist/index.js is stale. Run npm run build:action and commit dist/index.js"
            exit 1
          )
