# Example workflow — copy to any repo as:
#   .github/workflows/terraeye.yml
#
# Defaults only: no terraeye.yml, no Checkov/TFLint install needed.

name: TerraEye

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tf.json"
      - "**/terraform/**"

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: Terraform AI Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TerraEye
        uses: sanchetanparmar/terraeye@v0.1.1
        with:
          fail-on: critical,high

      # Optional later:
      # - plan-file: ...          # for cost $/month
      # - env OPENAI_API_KEY      # for AI recommendation text
